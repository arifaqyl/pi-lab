# /etc/nginx/sites-enabled/default
#
# Path-routed reverse proxy. TLS is terminated at the Cloudflare edge, so
# this listens on plain :80 and is only reachable via the tunnel.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # A FastAPI app mounted under a path. The trailing slashes matter:
    # /traffic/x -> http://127.0.0.1:8002/x
    location /traffic/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sahbukti/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # An app that already knows its own prefix keeps it on proxy_pass.
    location /ops-console/ {
        proxy_pass http://127.0.0.1:8091/ops-console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A websocket-using service (WAHA) needs the Upgrade headers.
    location /waha/ {
        proxy_pass http://127.0.0.1:2785/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static site at the root. try_files falls back to index.html for
    # client-side routes; note this also means a missing image returns
    # index.html with 200, which will silently break <img> tags.
    location / {
        root /var/www/site;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
